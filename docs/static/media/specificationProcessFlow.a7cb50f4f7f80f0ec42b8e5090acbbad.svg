<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg viewBox="0 0 680 140" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet" style="max-width: 100%; height: auto;">
  <defs>
    <linearGradient id="flowBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#faf5ff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#fef3c7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#faf5ff;stop-opacity:1" />
    </linearGradient>
    
    <!-- Arrow marker -->
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6b7280"/>
    </marker>
  </defs>
  
  <rect width="680" height="140" fill="url(#flowBg)"/>
  
  <!-- Step 1: Requirements Input -->
  <rect x="20" y="20" width="140" height="80" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="90" y="45" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#3b82f6">Requirements Input</text>
  <text x="90" y="65" text-anchor="middle" font-family="Arial" font-size="11" fill="#1e40af">User stories,</text>
  <text x="90" y="80" text-anchor="middle" font-family="Arial" font-size="11" fill="#1e40af">business rules</text>
  
  <!-- Arrow 1 -->
  <line x1="160" y1="60" x2="190" y2="60" stroke="#6b7280" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Step 2: Semantic Analysis -->
  <rect x="190" y="20" width="140" height="80" rx="8" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
  <text x="260" y="45" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#22c55e">Semantic Analysis</text>
  <text x="260" y="65" text-anchor="middle" font-family="Arial" font-size="11" fill="#15803d">NLP processing,</text>
  <text x="260" y="80" text-anchor="middle" font-family="Arial" font-size="11" fill="#15803d">validation</text>
  
  <!-- Arrow 2 -->
  <line x1="330" y1="60" x2="360" y2="60" stroke="#6b7280" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Step 3: Ontology Population -->
  <rect x="360" y="20" width="140" height="80" rx="8" fill="#f3e8ff" stroke="#a855f7" stroke-width="2"/>
  <text x="430" y="45" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#a855f7">Ontology Population</text>
  <text x="430" y="65" text-anchor="middle" font-family="Arial" font-size="11" fill="#7c3aed">Generate</text>
  <text x="430" y="80" text-anchor="middle" font-family="Arial" font-size="11" fill="#7c3aed">formal specs</text>
  
  <!-- Arrow 3 -->
  <line x1="500" y1="60" x2="530" y2="60" stroke="#6b7280" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Step 4: Validation & Approval -->
  <rect x="530" y="20" width="140" height="80" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="600" y="40" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#f59e0b">Validation &amp;</text>
  <text x="600" y="55" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#f59e0b">Approval</text>
  <text x="600" y="75" text-anchor="middle" font-family="Arial" font-size="11" fill="#d97706">Human review,</text>
  <text x="600" y="90" text-anchor="middle" font-family="Arial" font-size="11" fill="#d97706">refinement</text>
  
  <!-- Step Numbers -->
  <circle cx="90" cy="120" r="15" fill="#3b82f6" stroke="#1e40af" stroke-width="2"/>
  <text x="90" y="126" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="white">1</text>
  
  <circle cx="260" cy="120" r="15" fill="#22c55e" stroke="#15803d" stroke-width="2"/>
  <text x="260" y="126" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="white">2</text>
  
  <circle cx="430" cy="120" r="15" fill="#a855f7" stroke="#7c3aed" stroke-width="2"/>
  <text x="430" y="126" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="white">3</text>
  
  <circle cx="600" cy="120" r="15" fill="#f59e0b" stroke="#d97706" stroke-width="2"/>
  <text x="600" y="126" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="white">4</text>
</svg>