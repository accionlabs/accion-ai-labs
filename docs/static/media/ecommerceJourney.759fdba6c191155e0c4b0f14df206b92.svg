<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg viewBox="0 0 800 700" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet" style="max-width: 100%; height: auto;">
  <defs>
    <linearGradient id="journeyBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#faf5ff;stop-opacity:1" />
      <stop offset="20%" style="stop-color:#f3e8ff;stop-opacity:1" />
      <stop offset="40%" style="stop-color:#dbeafe;stop-opacity:1" />
      <stop offset="60%" style="stop-color:#dcfce7;stop-opacity:1" />
      <stop offset="80%" style="stop-color:#fef3c7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fecaca;stop-opacity:1" />
    </linearGradient>
    
    <!-- Arrow marker -->
    <marker id="journeyArrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,8 L8,4 z" fill="#6366f1"/>
    </marker>
  </defs>
  
  <rect width="800" height="700" fill="url(#journeyBg)"/>
  
  <!-- Title -->
  <text x="400" y="25" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold" fill="#374151">Complete E-commerce Journey: Functional Ontology Mapping</text>
  
  <!-- Persona Level -->
  <rect x="50" y="60" width="700" height="80" rx="12" fill="#f3e8ff" stroke="#9333ea" stroke-width="2"/>
  <circle cx="90" cy="100" r="20" fill="#9333ea"/>
  <text x="90" y="107" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="white">👤</text>
  <text x="150" y="90" font-family="Arial" font-size="16" font-weight="bold" fill="#9333ea">Persona:</text>
  <text x="220" y="90" font-family="Arial" font-size="14" fill="#7c3aed">"E-commerce Shopper"</text>
  <text x="150" y="110" font-family="Arial" font-size="12" fill="#6d28d9">Demographics: Tech-savvy millennials, budget-conscious</text>
  <text x="150" y="125" font-family="Arial" font-size="12" fill="#6d28d9">Context: Shopping for others, values convenience and reviews</text>
  
  <!-- Arrow 1 -->
  <path d="M 400 140 L 400 160" stroke="#6366f1" stroke-width="2" fill="none" marker-end="url(#journeyArrow)"/>
  
  <!-- Outcome Level -->
  <rect x="50" y="160" width="700" height="80" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <circle cx="90" cy="200" r="20" fill="#2563eb"/>
  <text x="90" y="207" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="white">🎯</text>
  <text x="150" y="190" font-family="Arial" font-size="16" font-weight="bold" fill="#2563eb">Outcome:</text>
  <text x="220" y="190" font-family="Arial" font-size="14" fill="#1e40af">"Complete Purchase"</text>
  <text x="150" y="210" font-family="Arial" font-size="12" fill="#1d4ed8">Success Criteria: Item purchased, delivered on time, recipient satisfied</text>
  <text x="150" y="225" font-family="Arial" font-size="12" fill="#1d4ed8">Business Value: Revenue generation, customer retention, referrals</text>
  
  <!-- Arrow 2 -->
  <path d="M 400 240 L 400 260" stroke="#6366f1" stroke-width="2" fill="none" marker-end="url(#journeyArrow)"/>
  
  <!-- Scenario Level -->
  <rect x="50" y="260" width="700" height="80" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <circle cx="90" cy="300" r="20" fill="#16a34a"/>
  <text x="90" y="307" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="white">📋</text>
  <text x="150" y="290" font-family="Arial" font-size="16" font-weight="bold" fill="#16a34a">Scenario:</text>
  <text x="220" y="290" font-family="Arial" font-size="14" fill="#15803d">"Buy Gift for Friend"</text>
  <text x="150" y="310" font-family="Arial" font-size="12" fill="#166534">Context: Birthday gift, $50 budget, need delivery by Friday</text>
  <text x="150" y="325" font-family="Arial" font-size="12" fill="#166534">Constraints: Limited time, uncertain of friend's preferences</text>
  
  <!-- Arrow 3 -->
  <path d="M 400 340 L 400 360" stroke="#6366f1" stroke-width="2" fill="none" marker-end="url(#journeyArrow)"/>
  
  <!-- Steps Level -->
  <rect x="50" y="360" width="700" height="120" rx="12" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <circle cx="90" cy="400" r="20" fill="#f59e0b"/>
  <text x="90" y="407" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="white">👣</text>
  <text x="150" y="385" font-family="Arial" font-size="16" font-weight="bold" fill="#f59e0b">Steps:</text>
  
  <!-- Step boxes -->
  <rect x="150" y="400" width="140" height="30" rx="4" fill="#ffffff" stroke="#f59e0b" stroke-width="1"/>
  <text x="220" y="420" text-anchor="middle" font-family="Arial" font-size="11" fill="#d97706">1. Search Products</text>
  
  <rect x="300" y="400" width="140" height="30" rx="4" fill="#ffffff" stroke="#f59e0b" stroke-width="1"/>
  <text x="370" y="420" text-anchor="middle" font-family="Arial" font-size="11" fill="#d97706">2. Review Options</text>
  
  <rect x="450" y="400" width="140" height="30" rx="4" fill="#ffffff" stroke="#f59e0b" stroke-width="1"/>
  <text x="520" y="420" text-anchor="middle" font-family="Arial" font-size="11" fill="#d97706">3. Make Decision</text>
  
  <rect x="600" y="400" width="140" height="30" rx="4" fill="#ffffff" stroke="#f59e0b" stroke-width="1"/>
  <text x="670" y="420" text-anchor="middle" font-family="Arial" font-size="11" fill="#d97706">4. Complete Transaction</text>
  
  <text x="400" y="455" text-anchor="middle" font-family="Arial" font-size="12" fill="#b45309">Sequential workflow with decision points and potential backtracking</text>
  
  <!-- Arrow 4 -->
  <path d="M 400 480 L 400 500" stroke="#6366f1" stroke-width="2" fill="none" marker-end="url(#journeyArrow)"/>
  
  <!-- Actions Level -->
  <rect x="50" y="500" width="700" height="150" rx="12" fill="#fecaca" stroke="#dc2626" stroke-width="2"/>
  <circle cx="90" cy="540" r="20" fill="#dc2626"/>
  <text x="90" y="547" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="white">⚡</text>
  <text x="150" y="525" font-family="Arial" font-size="16" font-weight="bold" fill="#dc2626">Actions:</text>
  <text x="220" y="525" font-family="Arial" font-size="12" fill="#991b1b">Atomic user intentions (examples from "Search Products")</text>
  
  <!-- Action examples in grid -->
  <rect x="150" y="545" width="120" height="25" rx="3" fill="#ffffff" stroke="#dc2626" stroke-width="1"/>
  <text x="210" y="560" text-anchor="middle" font-family="Arial" font-size="9" fill="#dc2626">Enter Search Term</text>
  
  <rect x="280" y="545" width="120" height="25" rx="3" fill="#ffffff" stroke="#dc2626" stroke-width="1"/>
  <text x="340" y="560" text-anchor="middle" font-family="Arial" font-size="9" fill="#dc2626">Apply Category Filter</text>
  
  <rect x="410" y="545" width="120" height="25" rx="3" fill="#ffffff" stroke="#dc2626" stroke-width="1"/>
  <text x="470" y="560" text-anchor="middle" font-family="Arial" font-size="9" fill="#dc2626">Sort by Price</text>
  
  <rect x="540" y="545" width="120" height="25" rx="3" fill="#ffffff" stroke="#dc2626" stroke-width="1"/>
  <text x="600" y="560" text-anchor="middle" font-family="Arial" font-size="9" fill="#dc2626">View Search Results</text>
  
  <rect x="150" y="580" width="120" height="25" rx="3" fill="#ffffff" stroke="#dc2626" stroke-width="1"/>
  <text x="210" y="595" text-anchor="middle" font-family="Arial" font-size="9" fill="#dc2626">Refine Search</text>
  
  <rect x="280" y="580" width="120" height="25" rx="3" fill="#ffffff" stroke="#dc2626" stroke-width="1"/>
  <text x="340" y="595" text-anchor="middle" font-family="Arial" font-size="9" fill="#dc2626">Save Search</text>
  
  <rect x="410" y="580" width="120" height="25" rx="3" fill="#ffffff" stroke="#dc2626" stroke-width="1"/>
  <text x="470" y="595" text-anchor="middle" font-family="Arial" font-size="9" fill="#dc2626">Clear Filters</text>
  
  <rect x="540" y="580" width="120" height="25" rx="3" fill="#ffffff" stroke="#dc2626" stroke-width="1"/>
  <text x="600" y="595" text-anchor="middle" font-family="Arial" font-size="9" fill="#dc2626">Navigate to Product</text>
  
  <text x="400" y="625" text-anchor="middle" font-family="Arial" font-size="11" fill="#7f1d1d">Each action is modality-independent and can be implemented across web, mobile, voice, AR, etc.</text>
  
  <!-- Footer -->
  <text x="400" y="680" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#374151">Hierarchical Structure Enables Precise Requirements and Perfect Traceability</text>
</svg>