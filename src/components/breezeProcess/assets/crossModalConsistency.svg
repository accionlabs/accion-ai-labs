  <!-- Voice Journey -->
  <rect x="510" y="200" width="160" height="30" rx="4" fill="#ffffff" stroke="#16a34a" stroke-width="1"/>
  <text x="590" y="220" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="#15803d">Journey: Voice Shopping</text>
  
  <!-- Voice Flows -->
  <rect x="510" y="240" width="160" height="50" rx="4" fill="#f0fdf4" stroke="#16a34a" stroke-width="1"/>
  <text x="590" y="255" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold" fill="#15803d">Conversations:</text>
  <text x="590" y="270" text-anchor="middle" font-family="Arial" font-size="9" fill="#166534">• Product Search Dialog</text>
  <text x="590" y="282" text-anchor="middle" font-family="Arial" font-size="9" fill="#166534">• Purchase Confirmation</text>
  
