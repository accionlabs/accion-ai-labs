  <text x="370" y="270" text-anchor="middle" font-family="Arial" font-size="9" fill="#6d28d9">• Touch-Optimized Discovery</text>
  <text x="370" y="282" text-anchor="middle" font-family="Arial" font-size="9" fill="#6d28d9">• Simplified Purchase Flow</text>
  
  <!-- Mobile Pages -->
