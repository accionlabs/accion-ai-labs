  <rect x="70" y="370" width="160" height="50" rx="4" fill="#e2e8f0" stroke="#2563eb" stroke-width="1"/>
  <text x="150" y="385" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold" fill="#1e40af">Organisms:</text>
  <text x="150" y="398" text-anchor="middle" font-family="Arial" font-size="9" fill="#1d4ed8">Product Grid, Navigation Header</text>
  <text x="150" y="410" text-anchor="middle" font-family="Arial" font-size="9" fill="#1d4ed8">Payment Form, Shopping Cart</text>
  
