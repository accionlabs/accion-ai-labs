  <text x="590" y="328" text-anchor="middle" font-family="Arial" font-size="9" fill="#166534">• "Search for products"</text>
  <text x="590" y="340" text-anchor="middle" font-family="Arial" font-size="9" fill="#166534">• "Tell me about this item"</text>
  <text x="590" y="352" text-anchor="middle" font-family="Arial" font-size="9" fill="#166534">• "Complete my purchase"</text>
  
  <!-- Voice Organisms -->
  <rect x="510" y="370" width="160" height="50" rx="4" fill="#d1fae5" stroke="#16a34a" stroke-width="1"/>
  <text x="590" y="385" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold" fill="#15803d">Patterns:</text>
  <text x="590" y="398" text-anchor="middle" font-family="Arial" font-size="9" fill="#166534">Intent Recognition, Confirmation</text>
  <text x="590" y="410" text-anchor="middle" font-family="Arial" font-size="9" fill="#166534">Error Handling, Context</text>
  
  <!-- Voice Molecules & Atoms -->
  <rect x="510" y="430" width="160" height="40" rx="4" fill="#a7f3d0" stroke="#16a34a" stroke-width="1"/>
  <text x="590" y="445" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold" fill="#15803d">Speech Elements:</text>
  <text x="590" y="458" text-anchor="middle" font-family="Arial" font-size="9" fill="#166534">Prompts, Responses, Commands</text>
  
  <!-- API Implementation -->
