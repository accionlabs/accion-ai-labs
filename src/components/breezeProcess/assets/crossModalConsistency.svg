  <text x="370" y="315" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold" fill="#7c3aed">Screens:</text>
  <text x="370" y="328" text-anchor="middle" font-family="Arial" font-size="9" fill="#6d28d9">• Search Screen</text>
  <text x="370" y="340" text-anchor="middle" font-family="Arial" font-size="9" fill="#6d28d9">• Product Detail Screen</text>
  <text x="370" y="352" text-anchor="middle" font-family="Arial" font-size="9" fill="#6d28d9">• Checkout Screen</text>
  
  <!-- Mobile Organisms -->
