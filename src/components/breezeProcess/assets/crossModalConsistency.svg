  <text x="150" y="255" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold" fill="#1e40af">Flows:</text>
  <text x="150" y="270" text-anchor="middle" font-family="Arial" font-size="9" fill="#1d4ed8">• Product Discovery Flow</text>
  <text x="150" y="282" text-anchor="middle" font-family="Arial" font-size="9" fill="#1d4ed8">• Purchase Flow</text>
  
  <!-- Web Pages -->
  <rect x="70" y="300" width="160" height="60" rx="4" fill="#f1f5f9" stroke="#2563eb" stroke-width="1"/>
  <text x="150" y="315" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold" fill="#1e40af">Pages:</text>
  <text x="150" y="328" text-anchor="middle" font-family="Arial" font-size="9" fill="#1d4ed8">• Search Results Page</text>
  <text x="150" y="340" text-anchor="middle" font-family="Arial" font-size="9" fill="#1d4ed8">• Product Detail Page</text>
  <text x="150" y="352" text-anchor="middle" font-family="Arial" font-size="9" fill="#1d4ed8">• Checkout Page</text>
  
