<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg viewBox="0 0 950 580" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet" style="max-width: 100%; height: auto;">
  <defs>
    <linearGradient id="modalBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f0f9ff;stop-opacity:1" />
      <stop offset="33%" style="stop-color:#f3e8ff;stop-opacity:1" />
      <stop offset="66%" style="stop-color:#dcfce7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fef3c7;stop-opacity:1" />
    </linearGradient>
    
    <!-- Arrow marker -->
    <marker id="modalArrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,8 L8,4 z" fill="#6366f1"/>
    </marker>
  </defs>
  
  <rect width="950" height="580" fill="url(#modalBg)"/>
  
  <!-- Title -->
  <text x="475" y="25" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold" fill="#374151">Cross-Modal Design Consistency: Same Function, Different Forms</text>
  
  <!-- Central Functional Action -->
  <rect x="375" y="60" width="200" height="60" rx="12" fill="#f3e8ff" stroke="#7c3aed" stroke-width="3"/>
  <text x="475" y="85" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#7c3aed">🎯 Functional Action</text>
  <text x="475" y="105" text-anchor="middle" font-family="Arial" font-size="14" fill="#6d28d9">"Complete Product Purchase"</text>
  
  <!-- Web Implementation -->
  <rect x="50" y="160" width="200" height="320" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="150" y="185" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#2563eb">💻 Web Interface</text>
  
  <!-- Web Journey -->
  <rect x="70" y="200" width="160" height="30" rx="4" fill="#ffffff" stroke="#2563eb" stroke-width="1"/>
  <text x="150" y="220" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="#1e40af">Journey: Shopping Experience</text>
  
  <!-- Web Flows -->
