  <text x="810" y="185" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#f59e0b">🔌 API Interface</text>
  
  <!-- API Journey -->
  <rect x="730" y="200" width="160" height="30" rx="4" fill="#ffffff" stroke="#f59e0b" stroke-width="1"/>
  <text x="810" y="220" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="#d97706">Journey: Integration Flow</text>
  
  <!-- API Flows -->
  <rect x="730" y="240" width="160" height="50" rx="4" fill="#fffbeb" stroke="#f59e0b" stroke-width="1"/>
  <text x="810" y="255" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold" fill="#d97706">Workflows:</text>
  <text x="810" y="270" text-anchor="middle" font-family="Arial" font-size="9" fill="#b45309">• Product Search API</text>
  <text x="810" y="282" text-anchor="middle" font-family="Arial" font-size="9" fill="#b45309">• Order Processing API</text>
  
  <!-- API Pages -->
  <rect x="730" y="300" width="160" height="60" rx="4" fill="#fef7cd" stroke="#f59e0b" stroke-width="1"/>
  <text x="810" y="315" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold" fill="#d97706">Endpoints:</text>
  <text x="810" y="328" text-anchor="middle" font-family="Arial" font-size="9" fill="#b45309">GET /products/search</text>
  <text x="810" y="340" text-anchor="middle" font-family="Arial" font-size="9" fill="#b45309">GET /products/{id}</text>
  <text x="810" y="352" text-anchor="middle" font-family="Arial" font-size="9" fill="#b45309">POST /orders</text>
  
  <!-- API Organisms -->
  <rect x="730" y="370" width="160" height="50" rx="4" fill="#fed7aa" stroke="#f59e0b" stroke-width="1"/>
  <text x="810" y="385" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold" fill="#d97706">Resources:</text>
  <text x="810" y="398" text-anchor="middle" font-family="Arial" font-size="9" fill="#b45309">Product Resource, Order Resource</text>
  <text x="810" y="410" text-anchor="middle" font-family="Arial" font-size="9" fill="#b45309">User Resource, Cart Resource</text>
  
  <!-- API Molecules & Atoms -->
  <rect x="730" y="430" width="160" height="40" rx="4" fill="#fdba74" stroke="#f59e0b" stroke-width="1"/>
  <text x="810" y="445" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold" fill="#d97706">Data Elements:</text>
  <text x="810" y="458" text-anchor="middle" font-family="Arial" font-size="9" fill="#b45309">JSON Fields, Schema Types</text>
  
  <!-- Arrows from central function to implementations -->
  <path d="M 375 90 L 250 180" stroke="#6366f1" stroke-width="2" fill="none" marker-end="url(#modalArrow)"/>
  <path d="M 425 120 L 370 160" stroke="#6366f1" stroke-width="2" fill="none" marker-end="url(#modalArrow)"/>
  <path d="M 525 120 L 590 160" stroke="#6366f1" stroke-width="2" fill="none" marker-end="url(#modalArrow)"/>
  <path d="M 575 90 L 710 180" stroke="#6366f1" stroke-width="2" fill="none" marker-end="url(#modalArrow)"/>
  
  <!-- Key insight -->
  <rect x="200" y="510" width="550" height="50" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
  <text x="475" y="530" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#7c3aed">Key Principle:</text>
  <text x="475" y="548" text-anchor="middle" font-family="Arial" font-size="12" fill="#6b7280">Same functional requirements map to optimized design implementations for each modality</text>
  <text x="475" y="562" text-anchor="middle" font-family="Arial" font-size="11" fill="#9ca3af">Maintaining consistent experience principles while adapting to platform constraints</text>
</svg>