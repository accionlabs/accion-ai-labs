<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg viewBox="0 0 1000 700" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet" style="max-width: 100%; height: auto;">
  <defs>
    <linearGradient id="breakdownBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc;stop-opacity:1" />
      <stop offset="20%" style="stop-color:#f1f5f9;stop-opacity:1" />
      <stop offset="40%" style="stop-color:#e2e8f0;stop-opacity:1" />
      <stop offset="60%" style="stop-color:#cbd5e1;stop-opacity:1" />
      <stop offset="80%" style="stop-color:#94a3b8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#64748b;stop-opacity:0.1" />
    </linearGradient>

    <!-- Arrow marker -->
    <marker id="breakdownArrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L6,3 z" fill="#374151"/>
    </marker>
  </defs>

  <rect width="1000" height="700" fill="url(#breakdownBg)"/>

  <!-- Title -->
  <text x="500" y="25" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold" fill="#374151">Design分解: ECサイト商品検索（Web実装）</text>

  <!-- Flow Level -->
  <rect x="50" y="50" width="900" height="60" rx="8" fill="#f3e8ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="80" y="75" font-family="Arial" font-size="14" font-weight="bold" fill="#7c3aed">フロー:</text>
  <text x="130" y="75" font-family="Arial" font-size="14" fill="#6d28d9">商品検索フロー</text>
  <text x="130" y="95" font-family="Arial" font-size="12" fill="#581c87">検索 → 閲覧 → フィルター → 比較 → 選択</text>

  <!-- Page Level -->
  <rect x="50" y="130" width="900" height="60" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="80" y="155" font-family="Arial" font-size="14" font-weight="bold" fill="#2563eb">ページ:</text>
  <text x="130" y="155" font-family="Arial" font-size="14" fill="#1e40af">検索結果ページ</text>
  <text x="130" y="175" font-family="Arial" font-size="12" fill="#1d4ed8">検索結果の表示と操作のための完全なインターフェース</text>

  <!-- Template Level -->
  <rect x="50" y="210" width="900" height="60" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="80" y="235" font-family="Arial" font-size="14" font-weight="bold" fill="#16a34a">テンプレート:</text>
  <text x="160" y="235" font-family="Arial" font-size="14" fill="#15803d">リストテンプレート</text>
  <text x="160" y="255" font-family="Arial" font-size="12" fill="#166534">ヘッダー、フィルター、コンテンツグリッド、ページネーションを含む再利用可能なレイアウトパターン</text>

  <!-- Organisms Level -->
  <rect x="50" y="290" width="900" height="120" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="80" y="315" font-family="Arial" font-size="14" font-weight="bold" fill="#f59e0b">オーガニズム:</text>

  <!-- Organism 1: Search Header -->
  <rect x="100" y="330" width="180" height="70" rx="6" fill="#ffffff" stroke="#f59e0b" stroke-width="1"/>
  <text x="190" y="350" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#d97706">検索ヘッダー</text>
  <text x="190" y="365" text-anchor="middle" font-family="Arial" font-size="10" fill="#b45309">ナビゲーション + 検索</text>
  <text x="190" y="378" text-anchor="middle" font-family="Arial" font-size="10" fill="#b45309">+ ユーザーメニュー</text>
  <text x="190" y="391" text-anchor="middle" font-family="Arial" font-size="9" fill="#92400e">複数のモレキュールを含む</text>

  <!-- Organism 2: Filter Sidebar -->
  <rect x="300" y="330" width="180" height="70" rx="6" fill="#ffffff" stroke="#f59e0b" stroke-width="1"/>
  <text x="390" y="350" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#d97706">フィルターサイドバー</text>
  <text x="390" y="365" text-anchor="middle" font-family="Arial" font-size="10" fill="#b45309">カテゴリフィルター</text>
  <text x="390" y="378" text-anchor="middle" font-family="Arial" font-size="10" fill="#b45309">+ 価格範囲</text>
  <text x="390" y="391" text-anchor="middle" font-family="Arial" font-size="9" fill="#92400e">インタラクティブフィルターグループ</text>

  <!-- Organism 3: Product Grid -->
  <rect x="500" y="330" width="180" height="70" rx="6" fill="#ffffff" stroke="#f59e0b" stroke-width="1"/>
  <text x="590" y="350" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#d97706">商品グリッド</text>
  <text x="590" y="365" text-anchor="middle" font-family="Arial" font-size="10" fill="#b45309">商品カードのグリッド</text>
  <text x="590" y="378" text-anchor="middle" font-family="Arial" font-size="10" fill="#b45309">+ ソートコントロール</text>
  <text x="590" y="391" text-anchor="middle" font-family="Arial" font-size="9" fill="#92400e">メインコンテンツエリア</text>

  <!-- Organism 4: Pagination -->
  <rect x="700" y="330" width="180" height="70" rx="6" fill="#ffffff" stroke="#f59e0b" stroke-width="1"/>
  <text x="790" y="350" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#d97706">ページネーションバー</text>
  <text x="790" y="365" text-anchor="middle" font-family="Arial" font-size="10" fill="#b45309">ページ番号</text>
  <text x="790" y="378" text-anchor="middle" font-family="Arial" font-size="10" fill="#b45309">+ ナビゲーション</text>
  <text x="790" y="391" text-anchor="middle" font-family="Arial" font-size="9" fill="#92400e">結果ナビゲーション</text>

  <!-- Molecules Level -->
  <rect x="50" y="430" width="900" height="120" rx="8" fill="#fecaca" stroke="#dc2626" stroke-width="2"/>
  <text x="80" y="455" font-family="Arial" font-size="14" font-weight="bold" fill="#dc2626">モレキュール:</text>
  <text x="80" y="470" font-family="Arial" font-size="11" fill="#991b1b">商品カードに注目（商品グリッドオーガニズムより）</text>

  <!-- Product Card Molecule -->
  <rect x="200" y="480" width="600" height="60" rx="6" fill="#ffffff" stroke="#dc2626" stroke-width="1"/>
  <text x="500" y="500" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#991b1b">商品カードモレキュール</text>
  <text x="500" y="515" text-anchor="middle" font-family="Arial" font-size="10" fill="#7f1d1d">商品表示のためにアトムを組み合わせた単一目的コンポーネント</text>
  <text x="500" y="530" text-anchor="middle" font-family="Arial" font-size="9" fill="#7f1d1d">含む: 商品画像 + 商品タイトル + 価格表示 + 評価スター + カートに追加ボタン</text>

  <!-- Atoms Level -->
  <rect x="50" y="570" width="900" height="110" rx="8" fill="#fce7f3" stroke="#ec4899" stroke-width="2"/>
  <text x="80" y="595" font-family="Arial" font-size="14" font-weight="bold" fill="#ec4899">アトム:</text>
  <text x="80" y="610" font-family="Arial" font-size="11" fill="#be185d">商品カードモレキュールを構成する個別の要素</text>

  <!-- Atom 1: Product Image -->
  <rect x="100" y="620" width="130" height="45" rx="4" fill="#ffffff" stroke="#ec4899" stroke-width="1"/>
  <text x="165" y="635" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold" fill="#be185d">商品画像</text>
  <text x="165" y="648" text-anchor="middle" font-family="Arial" font-size="8" fill="#9d174d">画像要素</text>
  <text x="165" y="658" text-anchor="middle" font-family="Arial" font-size="8" fill="#9d174d">altテキスト付き</text>

  <!-- Atom 2: Product Title -->
  <rect x="250" y="620" width="130" height="45" rx="4" fill="#ffffff" stroke="#ec4899" stroke-width="1"/>
  <text x="315" y="635" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold" fill="#be185d">商品タイトル</text>
  <text x="315" y="648" text-anchor="middle" font-family="Arial" font-size="8" fill="#9d174d">テキスト要素</text>
  <text x="315" y="658" text-anchor="middle" font-family="Arial" font-size="8" fill="#9d174d">リンク付き</text>

  <!-- Atom 3: Price Display -->
  <rect x="400" y="620" width="130" height="45" rx="4" fill="#ffffff" stroke="#ec4899" stroke-width="1"/>
  <text x="465" y="635" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold" fill="#be185d">価格表示</text>
  <text x="465" y="648" text-anchor="middle" font-family="Arial" font-size="8" fill="#9d174d">フォーマット済みテキスト</text>
  <text x="465" y="658" text-anchor="middle" font-family="Arial" font-size="8" fill="#9d174d">通貨記号付き</text>

  <!-- Atom 4: Rating Stars -->
  <rect x="550" y="620" width="130" height="45" rx="4" fill="#ffffff" stroke="#ec4899" stroke-width="1"/>
  <text x="615" y="635" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold" fill="#be185d">評価スター</text>
  <text x="615" y="648" text-anchor="middle" font-family="Arial" font-size="8" fill="#9d174d">アイコン要素</text>
  <text x="615" y="658" text-anchor="middle" font-family="Arial" font-size="8" fill="#9d174d">評価データ付き</text>

  <!-- Atom 5: Add to Cart Button -->
  <rect x="700" y="620" width="130" height="45" rx="4" fill="#ffffff" stroke="#ec4899" stroke-width="1"/>
  <text x="765" y="635" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold" fill="#be185d">カートに追加ボタン</text>
  <text x="765" y="648" text-anchor="middle" font-family="Arial" font-size="8" fill="#9d174d">インタラクティブボタン</text>
  <text x="765" y="658" text-anchor="middle" font-family="Arial" font-size="8" fill="#9d174d">アクション付き</text>

  <!-- Connection lines -->
  <path d="M 500 480 L 165 620" stroke="#374151" stroke-width="1" fill="none" marker-end="url(#breakdownArrow)" stroke-dasharray="2,2"/>
  <path d="M 500 480 L 315 620" stroke="#374151" stroke-width="1" fill="none" marker-end="url(#breakdownArrow)" stroke-dasharray="2,2"/>
  <path d="M 500 490 L 465 620" stroke="#374151" stroke-width="1" fill="none" marker-end="url(#breakdownArrow)" stroke-dasharray="2,2"/>
  <path d="M 500 480 L 615 620" stroke="#374151" stroke-width="1" fill="none" marker-end="url(#breakdownArrow)" stroke-dasharray="2,2"/>
  <path d="M 500 480 L 765 620" stroke="#374151" stroke-width="1" fill="none" marker-end="url(#breakdownArrow)" stroke-dasharray="2,2"/>

  <!-- Side labels -->
  <text x="25" y="350" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#374151" transform="rotate(-90 25 350)">複雑</text>
  <text x="25" y="525" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#374151" transform="rotate(-90 25 525)">シンプル</text>
  <text x="25" y="642" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#374151" transform="rotate(-90 25 642)">アトミック</text>
</svg>