  <text x="475" y="530" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#7c3aed">重要な原則:</text>
  <text x="475" y="548" text-anchor="middle" font-family="Arial" font-size="12" fill="#6b7280">同じ機能要件が各モダリティに最適化されたDesign実装にマッピングされます</text>
  <text x="475" y="562" text-anchor="middle" font-family="Arial" font-size="11" fill="#9ca3af">プラットフォームの制約に適応しながら一貫した体験原則を維持</text>
