<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg viewBox="0 0 900 650" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet" style="max-width: 100%; height: auto;">
  <defs>
    <linearGradient id="atomicBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#faf5ff;stop-opacity:1" />
      <stop offset="15%" style="stop-color:#f3e8ff;stop-opacity:1" />
      <stop offset="30%" style="stop-color:#dbeafe;stop-opacity:1" />
      <stop offset="45%" style="stop-color:#dcf4e7;stop-opacity:1" />
      <stop offset="60%" style="stop-color:#fef3c7;stop-opacity:1" />
      <stop offset="75%" style="stop-color:#fecaca;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fce7f3;stop-opacity:1" />
    </linearGradient>

    <!-- Arrow marker -->
    <marker id="atomicArrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,8 L8,4 z" fill="#6366f1"/>
    </marker>
  </defs>

  <rect width="900" height="650" fill="url(#atomicBg)"/>

  <!-- Title -->
  <text x="450" y="25" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold" fill="#374151">Design Ontology: Atomic Designの階層</text>

  <!-- Level 1: User Journeys -->
  <rect x="50" y="50" width="800" height="70" rx="12" fill="#f3e8ff" stroke="#7c3aed" stroke-width="2"/>
  <circle cx="90" cy="85" r="20" fill="#7c3aed"/>
  <text x="90" y="92" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="white">1</text>
  <text x="130" y="75" font-family="Arial" font-size="16" font-weight="bold" fill="#7c3aed">ユーザージャーニー</text>
  <text x="130" y="95" font-family="Arial" font-size="12" fill="#6d28d9">複数のアプリケーションにまたがるマルチセッション体験</text>
  <text x="130" y="110" font-family="Arial" font-size="11" fill="#581c87" font-style="italic">例: 顧客ライフサイクルジャーニー、従業員オンボーディング</text>

  <!-- Arrow 1 -->
  <path d="M 450 120 L 450 140" stroke="#6366f1" stroke-width="2" fill="none" marker-end="url(#atomicArrow)"/>

  <!-- Level 2: Flows -->
  <rect x="50" y="140" width="800" height="70" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <circle cx="90" cy="175" r="20" fill="#2563eb"/>
  <text x="90" y="182" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="white">2</text>
  <text x="130" y="165" font-family="Arial" font-size="16" font-weight="bold" fill="#2563eb">フロー</text>
  <text x="130" y="185" font-family="Arial" font-size="12" fill="#1e40af">複数のページを接続する単一セッションのシーケンス</text>
  <text x="130" y="200" font-family="Arial" font-size="11" fill="#1d4ed8" font-style="italic">例: 登録フロー、チェックアウトフロー、データインポートフロー</text>

  <!-- Arrow 2 -->
  <path d="M 450 210 L 450 230" stroke="#6366f1" stroke-width="2" fill="none" marker-end="url(#atomicArrow)"/>

  <!-- Level 3: Pages -->
  <rect x="50" y="230" width="800" height="70" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <circle cx="90" cy="265" r="20" fill="#16a34a"/>
  <text x="90" y="272" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="white">3</text>
  <text x="130" y="255" font-family="Arial" font-size="16" font-weight="bold" fill="#16a34a">ページ</text>
  <text x="130" y="275" font-family="Arial" font-size="12" fill="#15803d">個別のコンテキストを表す完全な画面またはインターフェースユニット</text>
  <text x="130" y="290" font-family="Arial" font-size="11" fill="#166534" font-style="italic">例: 商品一覧ページ、ユーザープロフィールページ、API レスポンススキーマ</text>

  <!-- Arrow 3 -->
  <path d="M 450 300 L 450 320" stroke="#6366f1" stroke-width="2" fill="none" marker-end="url(#atomicArrow)"/>

  <!-- Level 4: Templates -->
  <rect x="50" y="320" width="800" height="70" rx="12" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <circle cx="90" cy="355" r="20" fill="#f59e0b"/>
  <text x="90" y="362" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="white">4</text>
  <text x="130" y="345" font-family="Arial" font-size="16" font-weight="bold" fill="#f59e0b">テンプレート</text>
  <text x="130" y="365" font-family="Arial" font-size="12" fill="#d97706">再利用可能なページレベルのレイアウトパターン</text>
  <text x="130" y="380" font-family="Arial" font-size="11" fill="#b45309" font-style="italic">例: リストテンプレート、詳細テンプレート、ダッシュボードテンプレート</text>

  <!-- Arrow 4 -->
  <path d="M 450 390 L 450 410" stroke="#6366f1" stroke-width="2" fill="none" marker-end="url(#atomicArrow)"/>

  <!-- Level 5: Organisms -->
  <rect x="50" y="410" width="800" height="70" rx="12" fill="#fecaca" stroke="#dc2626" stroke-width="2"/>
  <circle cx="90" cy="445" r="20" fill="#dc2626"/>
  <text x="90" y="452" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="white">5</text>
  <text x="130" y="435" font-family="Arial" font-size="16" font-weight="bold" fill="#dc2626">オーガニズム</text>
  <text x="130" y="455" font-family="Arial" font-size="12" fill="#991b1b">特定の機能を持つ複合コンポーネントグループ</text>
  <text x="130" y="470" font-family="Arial" font-size="11" fill="#7f1d1d" font-style="italic">例: ナビゲーションヘッダー、商品グリッド、データテーブル</text>

  <!-- Arrow 5 -->
  <path d="M 450 480 L 450 500" stroke="#6366f1" stroke-width="2" fill="none" marker-end="url(#atomicArrow)"/>

  <!-- Level 6: Molecules -->
  <rect x="50" y="500" width="800" height="70" rx="12" fill="#e0e7ff" stroke="#4f46e5" stroke-width="2"/>
  <circle cx="90" cy="535" r="20" fill="#4f46e5"/>
  <text x="90" y="542" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="white">6</text>
  <text x="130" y="525" font-family="Arial" font-size="16" font-weight="bold" fill="#4f46e5">モレキュール</text>
  <text x="130" y="545" font-family="Arial" font-size="12" fill="#3730a3">単一目的のアトムの単純な組み合わせ</text>
  <text x="130" y="560" font-family="Arial" font-size="11" fill="#312e81" font-style="italic">例: 検索ボックス、商品カード、フォームフィールドグループ</text>

  <!-- Arrow 6 -->
  <path d="M 450 570 L 450 590" stroke="#6366f1" stroke-width="2" fill="none" marker-end="url(#atomicArrow)"/>

  <!-- Level 7: Atoms -->
  <rect x="50" y="590" width="800" height="50" rx="12" fill="#fce7f3" stroke="#ec4899" stroke-width="2"/>
  <circle cx="90" cy="615" r="18" fill="#ec4899"/>
  <text x="90" y="622" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="white">7</text>
  <text x="130" y="608" font-family="Arial" font-size="16" font-weight="bold" fill="#ec4899">アトム</text>
  <text x="130" y="628" font-family="Arial" font-size="12" fill="#be185d">これ以上分解できない個別のインターフェース要素</text>

  <!-- Side annotations -->
  <text x="30" y="85" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#7c3aed" transform="rotate(-90 30 85)">戦略的</text>
  <text x="30" y="265" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#16a34a" transform="rotate(-90 30 265)">構造的</text>
  <text x="30" y="535" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#ec4899" transform="rotate(-90 30 535)">アトミック</text>
</svg>