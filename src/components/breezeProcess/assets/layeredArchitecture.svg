<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg viewBox="0 0 300 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f1f5f9;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <rect width="300" height="220" fill="url(#bgGradient)"/>
  
  <!-- Query Interface Layer - Top -->
  <rect x="10" y="10" width="280" height="60" rx="5" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="150" y="35" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#3b82f6">Query Interface Layer</text>
  <text x="150" y="55" text-anchor="middle" font-family="Arial" font-size="12" fill="#1e40af">Cypher, GraphQL, REST APIs</text>
  
  <!-- Ontology Management Layer - Middle -->
  <rect x="10" y="80" width="280" height="60" rx="5" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
  <text x="150" y="105" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#22c55e">Ontology Management Layer</text>
  <text x="150" y="125" text-anchor="middle" font-family="Arial" font-size="12" fill="#15803d">Schema validation, evolution, conflict resolution</text>
  
  <!-- Storage Layer - Bottom -->
  <rect x="10" y="150" width="280" height="60" rx="5" fill="#f3e8ff" stroke="#a855f7" stroke-width="2"/>
  <text x="150" y="175" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#a855f7">Storage Layer</text>
  <text x="150" y="195" text-anchor="middle" font-family="Arial" font-size="12" fill="#7c3aed">Distributed graph database, version control</text>
</svg>